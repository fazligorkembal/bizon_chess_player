behavior_server:
  ros__parameters:
    cycle_frequency: 20.0
    try_count: 10

    behavior_plugins: ["wait_action", "board_action", "arm_action", "decision_action"]
    wait_action:
      plugin: "bizon_behaviors/WaitPlugin"
    board_action:
      plugin: "bizon_behaviors/BoardPlugin"
    arm_action:
      plugin: "bizon_behaviors/ArmPlugin"
      planning_time: 15.0
    decision_action:
      plugin: "bizon_behaviors/DecisionPlugin"
      # Deliberate per-side engine-strength handicap, not hardware tuning:
      # white plays deliberately weaker (Skill Level 5, MultiPV 3, depth 10)
      # so a human opponent has a chance, while black searches at full
      # engine strength. Tune per robot/side here, not in code.
      white:
        search_depth: 10
        skill_level: 5
        multipv: 3
      black:
        search_depth: 20
        skill_level: 20
        multipv: 1
      search_timeout: 10.0
      engine_threads: 1
      engine_hash_mb: 16
      box_size: 0.03718857142
      robot_base_offset_x: -0.3
      link_l1: 0.29
      link_l2: 0.18
      # state_file is deliberately absent: DecisionPlugin now takes its move
      # history from <debug_session_dir>/moves.txt, resolved once at launch
      # by bizon_player.launch.py's `game:=new|last` argument (see
      # CLAUDE.md). Setting state_file here would override that per-game
      # resolution with one fixed path shared by every game -- add it back
      # only if a robot genuinely needs to pin its history file outside the
      # debug/ tree.

