behavior_server:
  ros__parameters:
    cycle_frequency: 20.0
    try_count: 10

    behavior_plugins: ["wait_action", "board_action", "arm_action", "decision_action"]
    wait_action:
      plugin: "bizon_behaviors/WaitPlugin"
    board_action:
      plugin: "bizon_behaviors/BoardPlugin"
    arm_action:
      plugin: "bizon_behaviors/ArmPlugin"
      planning_time: 15.0
    decision_action:
      plugin: "bizon_behaviors/DecisionPlugin"
      # Deliberate per-side engine-strength handicap, not hardware tuning:
      # white plays deliberately weaker (Skill Level 5, MultiPV 3, depth 10)
      # so a human opponent has a chance, while black searches at full
      # engine strength. Tune per robot/side here, not in code.
      white:
        search_depth: 10
        skill_level: 5
        multipv: 3
      black:
        search_depth: 20
        skill_level: 20
        multipv: 1
      search_timeout: 10.0
      engine_threads: 1
      engine_hash_mb: 16
      box_size: 0.03718857142
      robot_base_offset_x: -0.3
      link_l1: 0.29
      link_l2: 0.18
      # Set explicitly rather than left to DecisionPlugin's
      # /tmp/bizon_<player_side>_last_moves.txt default: there is a real,
      # in-progress game's history on disk at this path (white_last_moves.txt,
      # 59 lines as of 2026-08-21), and /tmp is cleared on reboot -- letting
      # the default apply here would silently abandon it. The container
      # mounts the repo at this path; see CLAUDE.md.
      state_file: "/home/user/Documents/bizon_chess_player/white_last_moves.txt"

